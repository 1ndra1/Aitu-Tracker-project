<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AITU Academic Tracker</title>

<!-- Chart.js для графика на вкладке "Статистика" -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <header>
    <div class="brand">
      <!-- два логотипа: CSS показывает нужный в зависимости от темы -->
      <img class="logo logo-light" src="logo-light.png" alt="AITU Academic Habit & Task Tracker">
      <img class="logo logo-dark" src="logo-dark.png" alt="AITU Academic Habit & Task Tracker">
      <h1 class="visually-hidden">AITU Academic Habit &amp; Task Tracker</h1>
    </div>
    <div class="header-actions">
      <!-- кнопка темы: два svg, видно только один (смотри CSS) -->
      <button class="theme-toggle" id="themeToggle" aria-label="Сменить тему" title="Сменить тему">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path>
        </svg>
      </button>
      <div id="authContainer"></div>
    </div>
  </header>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('tasks', this)">Задачи</button>
    <button class="tab-btn" onclick="switchTab('schedule', this)">Расписание</button>
    <button class="tab-btn" onclick="switchTab('stats', this)">Статистика</button>
  </div>

  <main>
    <!-- вкладка 1: задачи -->
    <section id="tab-tasks" class="tab-content active panel">
      <div class="date-nav">
        <button class="btn btn-outline" onclick="changeDate(-1)">&larr; Пред.</button>
        <div class="date-center">
          <input type="date" id="datePicker" onchange="setDate(this.value)">
          <div id="dateLabel"></div>
        </div>
        <button class="btn btn-outline" onclick="changeDate(1)">След. &rarr;</button>
      </div>

      <div class="task-list" id="taskList"></div>

      <form class="task-form" onsubmit="addTask(event)">
        <input type="text" id="taskTitle" placeholder="Название задачи" required>
        <select id="taskSubject" required>
          <option value="" disabled selected>Выберите предмет</option>
          <option value="Линейная алгебра">Линейная алгебра</option>
          <option value="Математический анализ">Математический анализ</option>
          <option value="Введение в программирование">Введение в программирование</option>
          <option value="ИКТ">ИКТ</option>
          <option value="Иностранный язык">Иностранный язык</option>
          <option value="Культурология">Культурология</option>
          <option value="Физкультура">Физкультура</option>
        </select>
        <input type="time" id="taskTime">
        <button type="submit" class="btn btn-primary">Добавить</button>
      </form>
    </section>

    <!-- вкладка 2: расписание -->
    <section id="tab-schedule" class="tab-content panel">
      <h2>Расписание на неделю</h2>

      <div class="schedule-form-card">
        <h3>Добавить предмет в расписание</h3>
        <form class="schedule-form" onsubmit="addScheduleClass(event)">
          <select id="schedDay" required>
            <option value="Понедельник">Понедельник</option>
            <option value="Вторник">Вторник</option>
            <option value="Среда">Среда</option>
            <option value="Четверг">Четверг</option>
            <option value="Пятница">Пятница</option>
            <option value="Суббота">Суббота</option>
            <option value="Воскресенье">Воскресенье</option>
          </select>
          <input type="text" id="schedName" placeholder="Предмет (напр., ИКТ)" required>
          <input type="text" id="schedRoom" placeholder="Кабинет (напр., C1.1.365)" required>
          <input type="text" id="schedTime" placeholder="Время (напр., 08:00-10:00)" required>
          <button type="submit" class="btn btn-primary">Добавить</button>
        </form>
      </div>

      <div class="schedule-grid" id="scheduleContainer"></div>
    </section>

    <!-- вкладка 3: статистика -->
    <section id="tab-stats" class="tab-content panel">
      <h2>Продуктивность и статистика</h2>
      <div class="stats-container">
        <div class="stats-number" id="statsPercent">0%</div>
        <div class="stats-label">Общий процент выполнения</div>
        <div class="stats-text" id="statsText">Задач выполнено: 0 из 0</div>
        <div class="progress-wrap"><div class="progress-fill" id="statsBar"></div></div>

        <h3 style="text-align: left; margin-top: 20px;">График по дням недели</h3>
        <div class="chart-wrapper"><canvas id="productivityChart"></canvas></div>
      </div>
    </section>
  </main>
</div>

<!-- окно входа и регистрации -->
<div class="modal-overlay" id="authModal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle">Вход</h3>
      <button class="btn-close" onclick="closeModal()" aria-label="Закрыть">&times;</button>
    </div>

    <form id="authForm" onsubmit="handleAuth(event)" novalidate>

      <!-- имя нужно только при регистрации -->
      <div class="form-group" id="nameGroup" style="display: none;">
        <label for="authName">Имя</label>
        <div class="input-box" id="nameBox">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 4-6 8-6s8 2 8 6"></path></svg>
          <input type="text" id="authName" placeholder="Ваше имя">
        </div>
        <div class="error-text" id="nameError"></div>
      </div>

      <div class="form-group">
        <label for="authEmail">Email</label>
        <div class="input-box" id="emailBox">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg>
          <input type="email" id="authEmail" placeholder="student@aitu.edu.kz" autocomplete="email">
        </div>
        <div class="error-text" id="emailError"></div>
      </div>

      <div class="form-group">
        <label for="authPassword">Пароль</label>
        <div class="input-box" id="passBox">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
          <input type="password" id="authPassword" placeholder="Минимум 6 символов" autocomplete="current-password">
          <button type="button" class="eye-btn" onclick="togglePassword()" aria-label="Показать пароль" title="Показать / скрыть пароль">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
        <div class="error-text" id="passError"></div>
      </div>

      <div class="modal-footer">
        <button type="submit" class="btn btn-primary" id="authSubmitBtn">Войти</button>
        <div class="modal-switch" id="authSwitch" onclick="toggleAuthMode()">Нет аккаунта? Зарегистрируйтесь</div>
      </div>
    </form>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
